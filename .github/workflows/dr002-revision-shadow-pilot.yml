name: DR-002 synthetic post-cutoff revision shadow pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One accepted synthetic frozen producer shadow
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IMPLEMENTATION_SHA: ${{ github.sha }}
          SHADOW_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python scripts/forecast_bundles/dr002_frozen_producer_shadow_pilot_v1.py
          --implementation-git-sha "$IMPLEMENTATION_SHA"
          --run-id "$SHADOW_RUN_ID"
      - name: One accepted synthetic forecast lock shadow
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IMPLEMENTATION_SHA: ${{ github.sha }}
          SHADOW_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GIT_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/forecast_bundles/dr002_forecast_lock_shadow_pilot_v1.py
          --implementation-git-sha "$IMPLEMENTATION_SHA"
          --run-id "$SHADOW_RUN_ID"
          --repository "$REPOSITORY"
          --workflow "$WORKFLOW_NAME"
          --workflow-ref "$WORKFLOW_REF"
          --git-ref "$GIT_REF"
          --github-run-id "$RUN_ID"
          --github-run-attempt "$RUN_ATTEMPT"
      - name: One accepted synthetic outcome boundary shadow
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IMPLEMENTATION_SHA: ${{ github.sha }}
          SHADOW_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GIT_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/forecast_bundles/dr002_outcome_boundary_shadow_pilot_v1.py
          --implementation-git-sha "$IMPLEMENTATION_SHA"
          --run-id "$SHADOW_RUN_ID"
          --repository "$REPOSITORY"
          --workflow "$WORKFLOW_NAME"
          --workflow-ref "$WORKFLOW_REF"
          --git-ref "$GIT_REF"
          --github-run-id "$RUN_ID"
          --github-run-attempt "$RUN_ATTEMPT"
      - name: One Gate 2B-4 synthetic post-cutoff revision shadow
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IMPLEMENTATION_SHA: ${{ github.sha }}
          SHADOW_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GIT_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/forecast_bundles/dr002_revision_shadow_pilot_v1.py
          --implementation-git-sha "$IMPLEMENTATION_SHA"
          --run-id "$SHADOW_RUN_ID"
          --repository "$REPOSITORY"
          --workflow "$WORKFLOW_NAME"
          --workflow-ref "$WORKFLOW_REF"
          --git-ref "$GIT_REF"
          --github-run-id "$RUN_ID"
          --github-run-attempt "$RUN_ATTEMPT"
      - name: Attest exact successful revision execution manifest
        id: attest_revision
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: _runtime/dr002_pre2b7j_revision_shadow/gha-${{ github.run_id }}-${{ github.run_attempt }}/revision_execution_manifest.json
          push-to-registry: false
          create-storage-record: false
      - name: Preserve attestation bundle and factual metadata
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_revision.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest_revision.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest_revision.outputs.attestation-url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]
          if not run_id.isdigit() or not attempt.isdigit():
              raise ValueError("Invalid GitHub run identity")
          root = Path("_runtime/dr002_pre2b7j_revision_shadow") / ("gha-" + run_id + "-" + attempt)
          subject = root / "revision_execution_manifest.json"
          subject_bytes = subject.read_bytes()
          manifest = json.loads(subject_bytes)
          if manifest["status"] != "SHADOW_POST_CUTOFF_REVISION_ONLY_NOT_PRODUCTION":
              raise ValueError("Only successful synthetic revision manifests may be preserved")
          if manifest["implementation_git_sha"] != os.environ["HEAD_SHA"]:
              raise ValueError("Manifest/run head mismatch")
          if manifest["github_run_id"] != run_id or manifest["github_run_attempt"] != attempt:
              raise ValueError("Manifest/run identity mismatch")
          repository = os.environ["REPOSITORY"]
          workflow_path = ".github/workflows/dr002-revision-shadow-pilot.yml"
          expected_workflow_ref = repository + "/" + workflow_path + "@refs/heads/main"
          if manifest["repository"] != repository or manifest["workflow_path"] != workflow_path or manifest["workflow_name"] != os.environ["WORKFLOW_NAME"] or manifest["workflow_ref"] != os.environ["WORKFLOW_REF"] or manifest["workflow_ref"] != expected_workflow_ref or manifest["git_ref"] != "refs/heads/main":
              raise ValueError("Manifest/workflow identity mismatch")
          for field in (
              "revision_after_forecast_cutoff",
              "single_synthetic_revision_constructed",
              "gate2b4_revision_constructor_used",
              "completed_forecast_record_bound",
          ):
              if manifest[field] is not True:
                  raise ValueError("Missing mechanical revision claim")
          false_fields = (
              "revision_capture_externally_bound",
              "revision_receipt_externally_bound",
              "revision_clock_authenticated",
              "revision_source_publisher_authenticated",
              "observation_completeness_proven",
              "revision_completeness_proven",
              "revision_proof_completed",
              "durable_storage_proven",
              "full_gate2b1_chain_verified",
              "production_authenticated",
              "historical_availability_proven",
              "stable_engine_execution_proven",
              "blind_validation_eligible",
              "production_forecast_locked",
              "production_outcome_boundary_proven",
              "production_revision_tracking_proven",
              "dr002_activated",
              "promotion_allowed",
          )
          for field in false_fields:
              if manifest[field] is not False:
                  raise ValueError("Unsupported trust claim")
          digest = hashlib.sha256(subject_bytes).hexdigest()
          bundle_bytes = Path(os.environ["ATTESTATION_BUNDLE_PATH"]).read_bytes()
          bundle = json.loads(bundle_bytes)
          # Consistency check only: independent signature/identity verification is later.
          statement = json.loads(base64.b64decode(bundle["dsseEnvelope"]["payload"], validate=True))
          subjects = statement["subject"]
          if len(subjects) != 1 or subjects[0]["digest"].get("sha256") != digest:
              raise ValueError("Attestation subject/manifest mismatch")
          attestation_id = os.environ["ATTESTATION_ID"]
          attestation_url = os.environ["ATTESTATION_URL"]
          if not attestation_id.isdigit() or attestation_url != "https://github.com/" + repository + "/attestations/" + attestation_id:
              raise ValueError("Missing or inconsistent attestation outputs")
          bundle_target = root / "github_attestation.bundle.json"
          bundle_target.write_bytes(bundle_bytes)
          if bundle_target.read_bytes() != bundle_bytes:
              raise ValueError("Bundle readback mismatch")
          metadata = {
              "schema_version": "dr002-github-revision-shadow-attestation-metadata-v1",
              "attestation_id": attestation_id,
              "attestation_url": attestation_url,
              "subject_relative_path": subject.as_posix(),
              "subject_sha256": digest,
              "repository": repository,
              "workflow_path": workflow_path,
              "workflow_name": os.environ["WORKFLOW_NAME"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "git_head_sha": os.environ["HEAD_SHA"],
              "run_id": run_id,
              "run_attempt": attempt,
              "future_tlog_time_does_not_authenticate_internal_revision_clock": True,
              "consistency_check_only_not_cryptographic_verification": True,
              **{field: False for field in false_fields},
          }
          metadata_bytes = (json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          metadata_target = root / "github_attestation_metadata.json"
          metadata_target.write_bytes(metadata_bytes)
          if metadata_target.read_bytes() != metadata_bytes or subject.read_bytes() != subject_bytes:
              raise ValueError("Metadata readback or immutable subject mismatch")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr002-revision-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _runtime/dr002_pre2b7c_frozen_producer_shadow/**
            _runtime/dr002_pre2b7h_forecast_lock_shadow/**
            _runtime/dr002_pre2b7i_outcome_boundary_shadow/**
            _runtime/dr002_pre2b7j_revision_shadow/**
          if-no-files-found: warn
