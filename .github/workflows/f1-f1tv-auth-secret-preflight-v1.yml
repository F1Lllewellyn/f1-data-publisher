name: F1TV Authenticated Account Preflight (No Secret Output)

# Runs once when first merged, and can be manually dispatched later.
# Never runs the stable prediction engine or edits latest/history.
on:
  pull_request:
    paths:
      - '.github/workflows/f1-f1tv-auth-secret-preflight-v1.yml'
      - 'scripts/ops/f1_f1tv_auth_preflight_v1.py'
      - 'tests/test_f1_f1tv_auth_preflight_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/f1-f1tv-auth-secret-preflight-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prove authentication preflight never exports credentials
        run: python -m unittest discover -s tests -p test_f1_f1tv_auth_preflight_v1.py -v

  authenticate-f1tv:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: f1tv-auth-preflight-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install exact supported FastF1 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'fastf1==3.9.2'
      - name: Authenticate with private repository secrets without exposing responses
        shell: bash
        env:
          FASTF1_AUTH_METHOD: password
          F1_USERNAME: ${{ secrets.F1_USERNAME }}
          F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/ops/f1_f1tv_auth_preflight_v1.py --output-dir _runtime/f1tv_auth_preflight
      - name: Retain sanitized status only, even on failed login
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f1tv-auth-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: _runtime/f1tv_auth_preflight/status.json
          if-no-files-found: warn
          retention-days: 14
