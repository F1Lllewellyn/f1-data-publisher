name: F1 Session Data Processor Loop v1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'safe_test checks install; run_now processes recent completed session; manifest_audit checks stale manifests.'
        required: false
        default: 'run_now'
        type: choice
        options: [safe_test, run_now, manifest_audit]
      session_filter:
        description: 'Optional. Leave auto, or use practice 1, practice 2, practice 3, qualifying, race.'
        required: false
        default: 'auto'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-main-write-serialization
  cancel-in-progress: false

env:
  F1_OPENF1_HANDOVER_REQUIRED: "true"

jobs:
  session-data-processor:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'schedule' && 'manifest_audit' || github.event.inputs.mode || 'run_now' }}
      SESSION_FILTER: ${{ github.event.inputs.session_filter || 'auto' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark standalone capture custody
        run: |
          mkdir -p _runtime/session_data_processor
          touch _runtime/session_data_processor/start.marker
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install processor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pandas requests openpyxl
          python - <<'PY'
          import pandas, requests, openpyxl
          print("Session processor dependency preflight passed: pandas, requests, openpyxl")
          PY

      - name: Run session data processor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/session_data_processor/session_data_processor_loop_v1.py \
            --mode "${MODE}" \
            --season 2026 \
            --session-filter "${SESSION_FILTER}"

      - name: Upload session processor artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f1-session-data-processor-loop-v1
          path: |
            _runtime/session_data_processor/**
            latest/session_data_processor/**
            history/session_data_processor/**
            latest/latest_manifest.json
            latest/data_readiness.json
            latest/combined_source_manifest.json
            latest/forecast_bundle_ledger/session_data_processor/**
            history/forecast_bundle_ledger/session_data_processor/**
          if-no-files-found: ignore

      - name: Commit session processor outputs
        if: ${{ success() && env.MODE == 'run_now' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MARKER="_runtime/session_data_processor/start.marker"
          test -f "$MARKER"
          git diff --cached --quiet || { echo HOLD_PRESTAGED_INPUT; exit 1; }
          git diff --quiet HEAD -- history || { echo HOLD_HISTORICAL_EVIDENCE_MUTATION; exit 1; }
          git diff --quiet HEAD -- .github scripts configs docs .gitignore || { echo HOLD_UNREVIEWED_CODE_MUTATION; exit 1; }
          if git status --porcelain | grep -E 'Engine_2026-06-07_STABLE|F1_2026_Prediction_Model_Data_Workbook.*xlsx'; then
            echo HOLD_PROTECTED_ASSET_MUTATION; exit 1
          fi
          candidates=(
            "latest/session_data_processor"
            "history/session_data_processor"
            "latest/latest_manifest.json"
            "latest/data_readiness.json"
            "latest/combined_source_manifest.json"
            "latest/forecast_bundle_ledger/session_data_processor"
            "history/forecast_bundle_ledger/session_data_processor"
          )
          added=0
          for p in "${candidates[@]}"; do
            if [ -e "$p" ]; then
              if git check-ignore -q "$p"; then
                echo "Skipping ignored path: $p"
                continue
              fi
              while IFS= read -r -d '' f; do
                if ! git check-ignore -q "$f"; then git add -- "$f"; fi
              done < <(find "$p" -type f -newer "$MARKER" -print0)
              added=1
            fi
          done
          if [ "$added" = "0" ]; then
            echo "No session processor output paths exist to commit."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "No session processor changes to commit."
            exit 0
          fi
          git commit -m "chore: update session data processor artifacts"
          bash scripts/ops/safe_git_push_rebase_retry.sh
