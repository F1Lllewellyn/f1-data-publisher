name: F1 Autopilot Patch Receiver

on:
  repository_dispatch:
    types:
      - f1_autopilot_patch
      - f1_autopilot_patch_command
  workflow_dispatch:
    inputs:
      payload_json:
        description: Optional raw command JSON for manual receiver testing
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: f1-1c-autopilot-bridge-pr-only
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate_apply_pr:
    name: validate_apply_pr
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'f1_autopilot_patch' || github.event.action == 'f1_autopilot_patch_command'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize command payload
        env:
          CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD_JSON: ${{ inputs.payload_json }}
        run: node -e "const fs=require('fs'); fs.mkdirSync('_runtime/autopilot_bridge',{recursive:true}); const manual=(process.env.MANUAL_PAYLOAD_JSON||'').trim(); const raw=manual||process.env.CLIENT_PAYLOAD_JSON||'{}'; const obj=JSON.parse(raw); const cmd=obj.command||obj; fs.writeFileSync('_runtime/autopilot_bridge/command.json', JSON.stringify(cmd,null,2));"

      - name: Validate command
        run: node scripts/autopilot/validate_command.mjs --payload _runtime/autopilot_bridge/command.json --policy config/protected_paths.json --out _runtime/autopilot_bridge/validation.json

      - name: Apply command files
        run: node scripts/autopilot/apply_assistant_patch.mjs --payload _runtime/autopilot_bridge/command.json --validation _runtime/autopilot_bridge/validation.json --out _runtime/autopilot_bridge/applied_files.json

      - name: Run requested tests
        run: node scripts/autopilot/run_requested_tests.mjs --payload _runtime/autopilot_bridge/command.json --out _runtime/autopilot_bridge/test_results.json

      - name: Write bridge status ledger
        run: node scripts/autopilot/write_status_ledger.mjs --payload _runtime/autopilot_bridge/command.json --validation _runtime/autopilot_bridge/validation.json --applied _runtime/autopilot_bridge/applied_files.json --tests _runtime/autopilot_bridge/test_results.json --status PASS

      - name: Read PR metadata
        id: prmeta
        run: node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('_runtime/autopilot_bridge/command.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'branch='+c.target_branch+'\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title='+c.title+'\n'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'body='+((c.summary||'F1 1C Gmail Autopilot Bridge PR-only patch.').replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'))+'\n');"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.F1_WORKFLOW_PAT }}
          branch: ${{ steps.prmeta.outputs.branch }}
          base: main
          title: ${{ steps.prmeta.outputs.title }}
          body: ${{ steps.prmeta.outputs.body }}
          commit-message: ${{ steps.prmeta.outputs.title }}
          add-paths: |
            .github/workflows/f1_1c_repository_dispatch_catchall.yml
            .github/workflows/f1_autopilot_patch_receiver.yml
            .github/workflows/f1_ai_pr_log_advisory_reviewer.yml
            scripts/autopilot/**
            docs/autopilot_bridge/**
            health/autopilot_last_status.json
            logs/autopilot_bridge/**
