name: F1 1B Output Contract After Control Room v22

on:
  workflow_dispatch:
    inputs:
      commit_outputs:
        description: "Commit generated 1B output-contract artifacts"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Reconcile a persisted successful Peak receipt if its native event was omitted.
    - cron: '17,47 * * * *'
  workflow_run:
    branches: [main]
    workflows:
      - "F1 Peak Elite Control Room - One Click v1"
    types:
      - completed

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: f1-main-write-serialization
  cancel-in-progress: false

jobs:
  output-contract-after-control-room:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout repository latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconcile exact original Peak completion and consumer custody
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/f1_peak_elite_orchestrator_v1.py --repo-root . --operation reconcile_bridge_input

      - name: Verify committed upstream run and current session bytes
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/f1_peak_elite_orchestrator_v1.py --repo-root . --operation verify_bridge_input

      - name: Write bridge trigger report
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p latest/1b_output_contract _runtime/1b_output_contract
          touch _runtime/1b_output_contract/start.marker
          {
            echo "{"
            echo "  \"bridge_version\": \"v25\","
            echo "  \"event_name\": \"${GITHUB_EVENT_NAME}\","
            echo "  \"github_workflow\": \"${GITHUB_WORKFLOW}\","
            echo "  \"github_run_id\": \"${GITHUB_RUN_ID}\","
            echo "  \"checkout_ref\": \"main\","
            echo "  \"run_forecast_gate\": false,"
            echo "  \"promotion_allowed\": false,"
            echo "  \"stable_engine_modified\": false,"
            echo "  \"canonical_workbook_overwrite\": false,"
            echo "  \"purpose\": \"Run 1B output-contract ledger, downstream handoff, context publisher, and trigger governor after Control Room success.\""
            echo "}"
          } > latest/1b_output_contract/control_room_bridge_v25_trigger_report.json
          cat latest/1b_output_contract/control_room_bridge_v25_trigger_report.json

      - name: Run workbook persistence handoff static guard
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/f1_workbook_persistence_handoff_guard_v1.py --repo-root . --mode static --fail-on-issue

      - name: Run output-contract acceptance tests
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_f1_1b_integrated_recovery_consumer_custody.py' -v

      - name: Run output contract ledger and handoff
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/session_data_processor/f1_1b_output_contract_v16.py --repo-root . --mode run_now

      - name: Run v24 downstream consumer handoff writer
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/session_data_processor/f1_1b_downstream_consumer_handoff_v24.py --repo-root . --mode run_now

      - name: Run v25 consumer context publisher and trigger governor
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/session_data_processor/f1_1b_consumer_context_publisher_v25.py --repo-root . --mode run_now

      - name: Reverify upstream bytes after downstream consumption
        if: steps.reconcile.outputs.action == 'PROCESS'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/f1_peak_elite_orchestrator_v1.py --repo-root . --operation verify_bridge_output

      - name: Revalidate original completion before publication
        if: steps.reconcile.outputs.action == 'PROCESS'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ops/f1_peak_elite_orchestrator_v1.py --repo-root . --operation verify_bridge_origin

      - name: Write bridge completion marker
        shell: bash
        if: success() && steps.reconcile.outputs.action == 'PROCESS'
        run: |
          set -euo pipefail
          mkdir -p latest/1b_output_contract
          {
            echo "{"
            echo "  \"bridge_version\": \"v25\","
            echo "  \"completed_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"github_workflow\": \"${GITHUB_WORKFLOW}\","
            echo "  \"github_run_id\": \"${GITHUB_RUN_ID}\","
            echo "  \"run_forecast_gate\": false,"
            echo "  \"promotion_allowed\": false,"
            echo "  \"stable_engine_modified\": false,"
            echo "  \"canonical_workbook_overwrite\": false"
            echo "}"
          } > latest/1b_output_contract/control_room_bridge_v25_completion_report.json
          cat latest/1b_output_contract/control_room_bridge_v25_completion_report.json

      - name: Upload v25 bridge/context diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f1-1b-control-room-output-contract-context-v26-diagnostics
          path: |
            latest/1b_output_contract/**
            latest/1b_validation/**
            _runtime/1b_output_contract/**
            latest/readiness_handoff/**
            latest/downstream_consumers/**
            latest/consumer_trigger_governor/**
          if-no-files-found: ignore

      - name: Commit v25 output-contract bridge, downstream, context, and trigger artifacts
        if: ${{ success() && steps.reconcile.outputs.action == 'PROCESS' && (github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event.inputs.commit_outputs == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          # Stage only this bridge's new outputs, not upstream session history.
          MARKER="_runtime/1b_output_contract/start.marker"
          if [ ! -f "$MARKER" ]; then
            echo "Output-contract start marker missing. Refusing ambiguous publication."
            exit 1
          fi
          PROTECTED_PATTERN='Engine_2026-06-07_STABLE|F1_2026_Prediction_Model_Data_Workbook\.xlsx|F1_2026_Prediction_Model_Data_Workbook_updated_2026-06-06_v15_fastf1_kpi_integrated\.xlsx'
          if git status --porcelain --untracked-files=no | grep -E "$PROTECTED_PATTERN"; then
            echo "Protected stable engine or canonical workbook touched. Blocking commit."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "HOLD_PRESTAGED_INPUT"; exit 1
          fi
          if ! git diff --quiet HEAD -- history; then
            echo "HOLD_HISTORICAL_EVIDENCE_MUTATION"; exit 1
          fi
          if ! git diff --quiet HEAD -- .github scripts configs docs .gitignore; then
            echo "HOLD_UNREVIEWED_CODE_MUTATION"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          outputs=(
            "latest/forecast_bundle_ledger/latest_bundle_snapshot.json"
            "latest/readiness_handoff"
            "latest/material_change"
            "latest/1b_output_contract"
            "latest/1b_validation"
            "latest/last_good_state.json"
            "latest/downstream_consumers"
            "latest/chat_context"
            "latest/consumer_trigger_governor"
            "latest/notification_routing"
          )
          for p in "${outputs[@]}"; do
            if [ -e "$p" ] && ! git check-ignore -q "$p"; then
              git add -- "$p"
            fi
          done
          history_roots=(
            "history/1b_output_contract_receipts"
            "history/forecast_bundle_ledger"
            "history/downstream_consumers"
            "history/chat_context"
            "history/consumer_trigger_governor"
            "history/notification_routing"
          )
          for root in "${history_roots[@]}"; do
            if [ -d "$root" ]; then
              while IFS= read -r -d '' f; do
                if ! git check-ignore -q "$f"; then
                  git add -- "$f"
                fi
              done < <(find "$root" -type f -newer "$MARKER" -print0)
            fi
          done
          if git diff --cached --name-only | grep -E "$PROTECTED_PATTERN"; then
            echo "Protected stable engine or canonical workbook entered staged files. Blocking commit."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No v25 output-contract-only changes to commit."
          else
            git commit -m "chore: update bounded 1B output-contract and consumer context artifacts"
            bash scripts/ops/safe_git_push_rebase_retry.sh
          fi
