name: F1 Vegas 2026 FP3 G1 Current-Event Source Publication Once

# Executes only when the workflow is first merged into main. Original
# G1 publisher and immutable promotion guard remain the sole authorities.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f1-vegas-2026-fp3-event-source-publish-once.yml'
  pull_request:
    paths:
      - '.github/workflows/f1-vegas-2026-fp3-event-source-publish-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-main-write-serialization
  cancel-in-progress: false

jobs:
  review-readonly:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Contract: exact Las Vegas event and G1 immutable publisher
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/openf1/publish_openf1_lightweight_source_closure.py scripts/ops/f1_source_closure_publish_guard_v1.py
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/f1-vegas-2026-fp3-event-source-publish-once.yml').read_text()
          assert '--meeting-key 1300' in s and '--expected-session-key 11415' in s
          assert 'f1_source_closure_publish_guard_v1.py' in s
          assert 'github.event_name == \'push\'' in s
          assert '2026,11,21,3,25' in s
          assert 'contents: write' in s
          assert "f1-main-write-serialization" in s
          assert not any(line.strip().startswith('git push ') for line in s.splitlines())
          print('FP3 G1 exact event, calendar cutoff, immutable guard and single-write ownership: PASS')
          PY

  publish-fp3-current-event:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current main with original commit history and GitHub push credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install pandas requests openpyxl
      - name: Guard against late historical provider queries during qualifying paid window
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          now=dt.datetime.now(dt.timezone.utc)
          lower=dt.datetime(2026,11,21,2,0,tzinfo=dt.timezone.utc)
          upper=dt.datetime(2026,11,21,3,25,tzinfo=dt.timezone.utc)
          if not lower <= now < upper:
              raise SystemExit('HOLD_FP3_EVENT_SOURCE_PUBLISH_OUTSIDE_FREE_PREQUALIFYING_WINDOW')
          print('Exact 2026 Las Vegas completed FP3 source publication window',flush=True)
          PY
      - name: Generate verified FP3 current-event original source candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/openf1/publish_openf1_lightweight_source_closure.py \
            --season 2026 --completed-only true \
            --meeting-key 1300 --expected-session-key 11415 \
            --output-root . \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-workflow "$GITHUB_WORKFLOW" \
            --github-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --github-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve exact original G1 source candidate and immutable history before publishing
        id: original_source_artifact
        uses: actions/upload-artifact@v6
        with:
          name: f1-lv2026-fp3-g1-original-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            latest/openf1_event_source_closure/1300/**
            history/openf1_event_source_closure/1300/**
          if-no-files-found: error
          retention-days: 90
      - name: Publish only through original G1 remote-aware immutable source guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/ops/f1_source_closure_publish_guard_v1.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --remote origin \
            --branch main \
            --meeting-key 1300 \
            --expected-session-key 11415 \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-sha "$GITHUB_SHA" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-season 2026 \
            --expected-completed-only true \
            --github-run-id "$GITHUB_RUN_ID" \
            --artifact-uploaded-for-run "$GITHUB_RUN_ID"
