name: F1 isolated efficient artifact access feasibility test

on:
  push:
    branches:
      - test/2026-10-21-efficient-artifact-access-01

permissions:
  contents: read
  actions: read

jobs:
  probe-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_11353_id: ${{ steps.upload_11353.outputs.artifact-id }}
      artifact_11727_id: ${{ steps.upload_11727.outputs.artifact-id }}
      sha_11353: ${{ steps.synthetic.outputs.sha_11353 }}
      sha_11727: ${{ steps.synthetic.outputs.sha_11727 }}
      bytes_11353: ${{ steps.synthetic.outputs.bytes_11353 }}
      bytes_11727: ${{ steps.synthetic.outputs.bytes_11727 }}
    steps:
      - name: Probe immutable historical artifact metadata and byte ranges
        id: range_probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/range-probe"
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              11916289450: {
                  "size_in_bytes": 603154203,
                  "digest": "sha256:4ca78ad6fbd1af8626429ef50166929c830f2a157520a92df7b92a182462c7dd",
              },
              12367877862: {
                  "size_in_bytes": 603154203,
                  "digest": "sha256:ba23c00abb59b750da2f637162c3306bfefc44c2612d9ffa144335bdacd52963",
              },
          }
          Path("/tmp/expected-artifacts.json").write_text(json.dumps(expected, sort_keys=True))
          PY

          for artifact_id in 11916289450 12367877862; do
            metadata="$RUNNER_TEMP/range-probe/${artifact_id}.metadata.json"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata"
            python - "$artifact_id" "$metadata" <<'PY'
          import json, sys
          artifact_id = int(sys.argv[1])
          actual = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = json.load(open("/tmp/expected-artifacts.json", encoding="utf-8"))[str(artifact_id)]
          for key in ("size_in_bytes", "digest"):
              if actual.get(key) != expected[key]:
                  raise SystemExit(f"metadata mismatch {artifact_id} {key}: {actual.get(key)!r}")
          if actual.get("expired") is not False:
              raise SystemExit(f"artifact {artifact_id} is expired")
          print(f"artifact={artifact_id} metadata=PASS size={actual['size_in_bytes']} digest={actual['digest']}")
          PY

            body="$RUNNER_TEMP/range-probe/${artifact_id}.range.bin"
            headers="$RUNNER_TEMP/range-probe/${artifact_id}.headers"
            set +e
            curl --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --range 0-255 \
              --max-filesize 4096 \
              --max-time 30 \
              --dump-header "$headers" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$body"
            curl_rc=$?
            set -e
            python - "$artifact_id" "$curl_rc" "$headers" "$body" <<'PY'
          import json, pathlib, re, sys
          artifact_id = int(sys.argv[1]); curl_rc = int(sys.argv[2])
          headers = pathlib.Path(sys.argv[3]).read_text(errors="replace")
          body = pathlib.Path(sys.argv[4])
          blocks = re.split(r"\r?\n\r?\n", headers)
          statuses = []
          final_headers = ""
          for block in blocks:
              first = block.splitlines()[0] if block.splitlines() else ""
              match = re.match(r"HTTP/\S+\s+(\d+)", first)
              if match:
                  statuses.append(int(match.group(1)))
                  final_headers = block
          size = body.stat().st_size if body.exists() else 0
          content_range = None
          content_length = None
          for line in final_headers.splitlines()[1:]:
              if ":" not in line: continue
              k, v = line.split(":", 1)
              if k.lower() == "content-range": content_range = v.strip()
              if k.lower() == "content-length": content_length = v.strip()
          passed = curl_rc == 0 and statuses and statuses[-1] == 206 and size == 256 and content_range
          result = {
              "artifact_id": artifact_id,
              "curl_rc": curl_rc,
              "http_status_chain": statuses,
              "final_status": statuses[-1] if statuses else None,
              "content_range": content_range,
              "content_length": content_length,
              "bytes_written": size,
              "range_supported": bool(passed),
          }
          pathlib.Path(sys.argv[4] + ".result.json").write_text(json.dumps(result, sort_keys=True) + "\n")
          print(json.dumps(result, sort_keys=True))
          if not passed and size > 4096:
              raise SystemExit("unsafe unexpected body exceeded cap")
          PY
          done

      - name: Generate two deterministic synthetic session objects
        id: synthetic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p synthetic
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          fixtures = {
              "session-11353-driver-10.synthetic.json": {
                  "schema": "f1-synthetic-hf-access-v1",
                  "session_key": 11353,
                  "driver_number": 10,
                  "endpoints": {
                      "car_data": [{"date": "2026-08-23T12:00:00.000Z", "speed": 201, "rpm": 10987}],
                      "location": [{"date": "2026-08-23T12:00:00.000Z", "x": 101, "y": 202, "z": 3}],
                  },
              },
              "session-11727-driver-10.synthetic.json": {
                  "schema": "f1-synthetic-hf-access-v1",
                  "session_key": 11727,
                  "driver_number": 10,
                  "endpoints": {
                      "car_data": [{"date": "2026-10-09T02:00:00.000Z", "speed": 187, "rpm": 10321}],
                      "location": [{"date": "2026-10-09T02:00:00.000Z", "x": 303, "y": 404, "z": 5}],
                  },
              },
          }
          for name, payload in fixtures.items():
              data = (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
              Path("synthetic", name).write_bytes(data)
              print(name, len(data), hashlib.sha256(data).hexdigest())
          PY
          sha_11353=$(sha256sum synthetic/session-11353-driver-10.synthetic.json | cut -d' ' -f1)
          sha_11727=$(sha256sum synthetic/session-11727-driver-10.synthetic.json | cut -d' ' -f1)
          bytes_11353=$(stat -c %s synthetic/session-11353-driver-10.synthetic.json)
          bytes_11727=$(stat -c %s synthetic/session-11727-driver-10.synthetic.json)
          echo "sha_11353=$sha_11353" >> "$GITHUB_OUTPUT"
          echo "sha_11727=$sha_11727" >> "$GITHUB_OUTPUT"
          echo "bytes_11353=$bytes_11353" >> "$GITHUB_OUTPUT"
          echo "bytes_11727=$bytes_11727" >> "$GITHUB_OUTPUT"

      - name: Upload session 11353 as an unarchived immutable artifact
        id: upload_11353
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: synthetic/session-11353-driver-10.synthetic.json
          archive: false
          retention-days: 1
          if-no-files-found: error

      - name: Upload session 11727 as an unarchived immutable artifact
        id: upload_11727
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: synthetic/session-11727-driver-10.synthetic.json
          archive: false
          retention-days: 1
          if-no-files-found: error

  fresh-job-retrieval:
    needs: probe-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start first exact-ID retrieval timer
        run: echo "START_11353=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Download session 11353 by exact artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.probe-and-upload.outputs.artifact_11353_id }}
          path: retrieved/11353
          skip-decompress: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify session 11353 identity, hash, size and elapsed time
        id: verify_11353
        env:
          EXPECTED_SHA: ${{ needs.probe-and-upload.outputs.sha_11353 }}
          EXPECTED_BYTES: ${{ needs.probe-and-upload.outputs.bytes_11353 }}
          ARTIFACT_ID: ${{ needs.probe-and-upload.outputs.artifact_11353_id }}
        shell: bash
        run: |
          set -euo pipefail
          end=$(date +%s%N)
          elapsed_ns=$((end - START_11353))
          mapfile -t files < <(find retrieved/11353 -type f -print)
          test "${#files[@]}" -eq 1
          actual_sha=$(sha256sum "${files[0]}" | cut -d' ' -f1)
          actual_bytes=$(stat -c %s "${files[0]}")
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          python - "${files[0]}" <<'PY'
          import json, sys
          obj=json.load(open(sys.argv[1], encoding="utf-8"))
          assert obj["session_key"] == 11353 and obj["driver_number"] == 10
          assert set(obj["endpoints"]) == {"car_data", "location"}
          PY
          echo "artifact=$ARTIFACT_ID session=11353 sha256=$actual_sha bytes=$actual_bytes elapsed_ns=$elapsed_ns amplification=1.0"

      - name: Start second exact-ID retrieval timer
        run: echo "START_11727=$(date +%s%N)" >> "$GITHUB_ENV"

      - name: Download session 11727 by exact artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.probe-and-upload.outputs.artifact_11727_id }}
          path: retrieved/11727
          skip-decompress: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Verify session 11727 identity, hash, size, total transfer and elapsed time
        env:
          EXPECTED_SHA: ${{ needs.probe-and-upload.outputs.sha_11727 }}
          EXPECTED_BYTES: ${{ needs.probe-and-upload.outputs.bytes_11727 }}
          BYTES_11353: ${{ needs.probe-and-upload.outputs.bytes_11353 }}
          ARTIFACT_ID: ${{ needs.probe-and-upload.outputs.artifact_11727_id }}
        shell: bash
        run: |
          set -euo pipefail
          end=$(date +%s%N)
          elapsed_ns=$((end - START_11727))
          mapfile -t files < <(find retrieved/11727 -type f -print)
          test "${#files[@]}" -eq 1
          actual_sha=$(sha256sum "${files[0]}" | cut -d' ' -f1)
          actual_bytes=$(stat -c %s "${files[0]}")
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          python - "${files[0]}" <<'PY'
          import json, sys
          obj=json.load(open(sys.argv[1], encoding="utf-8"))
          assert obj["session_key"] == 11727 and obj["driver_number"] == 10
          assert set(obj["endpoints"]) == {"car_data", "location"}
          PY
          total_bytes=$((BYTES_11353 + actual_bytes))
          echo "artifact=$ARTIFACT_ID session=11727 sha256=$actual_sha bytes=$actual_bytes elapsed_ns=$elapsed_ns amplification=1.0"
          echo "PASS_EFFICIENT_ARTIFACT_ACCESS total_payload_bytes=$total_bytes total_amplification=1.0"
