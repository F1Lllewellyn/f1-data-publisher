name: DR-002 Pre-Austin Saved Source Trust Verify

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: dr002-preaustin-saved-source-trust-verify
  cancel-in-progress: false

jobs:
  verify-saved-source-trust:
    name: Verify fixed historical source custody
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: F1Lllewellyn/f1-data-publisher
      TRUSTED_WORKFLOW: .github/workflows/f1-openf1-lightweight-source-closure.yml
      TRUSTED_REF: refs/heads/main
      TRUSTED_REPOSITORY_ID: '1262398563'
      WORK_ROOT: ${{ runner.temp }}/dr002-k4r37

    steps:
      - name: Reject any non-main or non-GitHub-hosted invocation
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REPOSITORY" = "$GH_REPO" || { echo 'HOLD: repository mismatch'; exit 1; }
          test "$ACTUAL_REF" = "$TRUSTED_REF" || { echo 'HOLD: source ref mismatch'; exit 1; }
          test "$RUNNER_ENVIRONMENT" = 'github-hosted' || { echo 'HOLD: self-hosted runner forbidden'; exit 1; }

      - name: Preflight official GitHub trusted verification
        run: |
          set -euo pipefail
          umask 077
          rm -rf "$WORK_ROOT"
          mkdir -p "$WORK_ROOT"
          gh --version | sed -n '1p'
          gh attestation verify --help > "$WORK_ROOT/verify-help.txt"
          for flag in --repo --bundle --cert-identity --source-ref --source-digest --deny-self-hosted-runners --format; do
            grep -q -- "$flag" "$WORK_ROOT/verify-help.txt" || { echo "HOLD: required gh flag unavailable: $flag"; exit 1; }
          done
          gh attestation trusted-root > "$WORK_ROOT/trusted-root.jsonl"
          test -s "$WORK_ROOT/trusted-root.jsonl" || { echo 'HOLD: trusted Sigstore root unavailable'; exit 1; }
          ROOT_SHA=$(sha256sum "$WORK_ROOT/trusted-root.jsonl" | cut -d' ' -f1)
          ROOT_BYTES=$(wc -c < "$WORK_ROOT/trusted-root.jsonl")
          printf 'trusted_root_access=PASS sha256=%s bytes=%s\n' "$ROOT_SHA" "$ROOT_BYTES"
          rm -f "$WORK_ROOT/verify-help.txt" "$WORK_ROOT/trusted-root.jsonl"

      - name: Retrieve and validate the six fixed historical artifacts
        env:
          FIXED_EVIDENCE_JSON: >-
            {"weather":{"endpoint":"weather","session":"11371","run":"38759663655","attempt":"1","head":"350399dc1c03eb64563cba5db1fa6c13627185ec","source_id":"11984079371","source_name":"dr002-pre2b7k4r2-openf1-historical-rest-shadow","source_zip_sha256":"3e00b6b5f2d0ac11840fa85e60b7bc2de290fc82888ea0b8736b3b5f700aad7a","custody_id":"11985256891","custody_name":"dr002-pre2b7k4r28-openf1-manual-shadow-custody-38759663655-1","custody_zip_sha256":"dc75297f0658c2dce3d03a631df69baa73283827e6accf21a6ec230fdd6ca410","manifest_sha256":"a9c5b0d7c3b21ebd29cc8b88cf5245f3cb0c5eebb835c233881d9770b7af321c","receipt_sha256":"cbea09505e6bd2988023c1d08fdd6639bb92b17ea37a082828d35de292519aa1","raw_name":"weather.response.json","raw_sha256":"bdd5e108329c896f2e1b7bded170e00ff3dbecb7ec76663e7d86f7bb87aeeae6","raw_rows":85,"attestation_id":"56322128"},"drivers":{"endpoint":"drivers","session":"11371","run":"38760517922","attempt":"1","head":"350399dc1c03eb64563cba5db1fa6c13627185ec","source_id":"11985667090","source_name":"dr002-pre2b7k4r7-openf1-drivers-historical-rest-shadow","source_zip_sha256":"cf1899aefffeaad49dce1c8605159937d62a96286cf93778649d372b91712f3a","custody_id":"11985134183","custody_name":"dr002-pre2b7k4r28-openf1-manual-shadow-custody-38760517922-1","custody_zip_sha256":"120e3164eb43a59059a19db0d0cacb701e8163d8bd67e7ec82b9976898e22e6d","manifest_sha256":"0f5f4d9606365df7fb8013301d56f4ea082bec1eb6d3bed82f91942edff216a3","receipt_sha256":"094ac44929569e4de556528fc0d435ae48596b6b2202bdcc5eb54164517fcff8","raw_name":"drivers.response.json","raw_sha256":"66b3d285c5cfc388d488c14e59d03a3ca2f3bd910a7ad5c8ad3e76c7f91148fb","raw_rows":22,"attestation_id":"56324646"},"starting_grid":{"endpoint":"starting_grid","session":"11373","run":"38727977099","attempt":"1","head":"60c41305fcf4d7752027df8633397bf6025c28c0","source_id":"11969660460","source_name":"dr002-pre2b7k4r15-openf1-starting-grid-historical-shadow","source_zip_sha256":"29ccb6752ac62274f7c73d38893068a31c3626f45a963871b00ba8ef80455e88","custody_id":"11969236113","custody_name":"dr002-pre2b7k4r28-openf1-manual-shadow-custody-38727977099-1","custody_zip_sha256":"e7ba66c88158303cb9a17232ef2435988664385e0587792d40db9d3284283a34","manifest_sha256":"cf88e0bee662327276fc16ee57ef2c01e1d8679e501cb321a2080f30fb875399","receipt_sha256":"d7190a76cbd1728a0ea7488937da5bc65024e09032b56d11f1f1550f5d186294","raw_name":"starting_grid.response.json","raw_sha256":"23d798ed27e99138c6bcc61e6efbc557a4022f18ea874dee489f98b6f571cda9","raw_rows":22,"attestation_id":"56236554"}}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$WORK_ROOT/downloads" "$WORK_ROOT/extracted"
          printf '%s' "$FIXED_EVIDENCE_JSON" > "$WORK_ROOT/fixed-evidence.json"

          for label in weather drivers starting_grid; do
            SOURCE_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]]["source_id"])' "$WORK_ROOT/fixed-evidence.json" "$label")
            CUSTODY_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]]["custody_id"])' "$WORK_ROOT/fixed-evidence.json" "$label")
            RUN_ID=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]]["run"])' "$WORK_ROOT/fixed-evidence.json" "$label")
            gh api "repos/${GH_REPO}/actions/artifacts/${SOURCE_ID}" > "$WORK_ROOT/downloads/${label}-source-metadata.json"
            gh api "repos/${GH_REPO}/actions/artifacts/${CUSTODY_ID}" > "$WORK_ROOT/downloads/${label}-custody-metadata.json"
            gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" > "$WORK_ROOT/downloads/${label}-run-metadata.json"
            gh api "repos/${GH_REPO}/actions/artifacts/${SOURCE_ID}/zip" > "$WORK_ROOT/downloads/${label}-source.zip"
            gh api "repos/${GH_REPO}/actions/artifacts/${CUSTODY_ID}/zip" > "$WORK_ROOT/downloads/${label}-custody.zip"
          done

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import zipfile

          root = Path(os.environ["WORK_ROOT"])
          fixed = json.loads((root / "fixed-evidence.json").read_text())
          repository = os.environ["GH_REPO"]
          workflow_path = os.environ["TRUSTED_WORKFLOW"]
          trusted_ref = os.environ["TRUSTED_REF"]
          workflow_name = "F1 OpenF1 Lightweight Source Closure"
          common = {
              "historical_rest_capture_assessment.json",
              "shadow_manifest.json",
              "shadow_report.md",
              "source_capture_receipt.json",
          }
          source_members = {
              "weather": common | {"weather.response.json"},
              "drivers": common | {"drivers.response.json"},
              "starting_grid": common | {
                  "sessions.response.json", "starting_grid.response.json"
              },
          }
          custody_members = {
              "custody_manifest.json",
              "github_attestation.bundle.json",
              "github_attestation_metadata.json",
          }
          false_claims = {
              "source_publisher_authenticated",
              "first_observed_clock_authenticated",
              "historical_availability_proven",
              "source_capture_externally_attested_as_first_observed",
              "verified_receipt_bindings_created",
              "official_fia_final_grid_authenticated",
              "revision_completeness_proven",
              "production_authenticated",
              "blind_validation_eligible",
              "producer_execution_attempted",
              "forecast_generated",
              "forecast_locked",
              "stable_engine_execution_proven",
              "dr002_activated",
              "promotion_allowed",
          }

          def hold(reason):
              raise SystemExit("HOLD: " + reason)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def strict_json(data, kind, reason):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          hold(reason + ":duplicate-key")
                      result[key] = value
                  return result
              try:
                  value = json.loads(
                      data.decode("utf-8"), object_pairs_hook=pairs,
                      parse_constant=lambda _v: hold(reason + ":nonfinite"),
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError):
                  hold(reason)
              if type(value) is not kind:
                  hold(reason)
              return value

          def scalar_text(value, reason):
              if type(value) is not str or not value:
                  hold(reason)
              return value

          def exact(value, expected, reason):
              if value != expected or type(value) is not type(expected):
                  hold(reason)

          def unzip_exact(archive, destination, expected, reason):
              destination.mkdir(mode=0o700)
              try:
                  with zipfile.ZipFile(archive) as zf:
                      infos = zf.infolist()
                      names = [item.filename for item in infos]
                      if len(names) != len(set(names)) or set(names) != expected:
                          hold(reason + ":member-set")
                      total = 0
                      for info in infos:
                          name = info.filename
                          path = PurePosixPath(name)
                          mode = info.external_attr >> 16
                          if (
                              path.name != name or path.is_absolute()
                              or name in {".", ".."} or "\\" in name or "%" in name
                              or info.is_dir() or stat.S_ISLNK(mode)
                              or info.file_size <= 0 or info.file_size > 16 * 1024 * 1024
                          ):
                              hold(reason + ":unsafe-member")
                          total += info.file_size
                          if total > 64 * 1024 * 1024:
                              hold(reason + ":size-limit")
                          data = zf.read(info)
                          if len(data) != info.file_size:
                              hold(reason + ":short-read")
                          target = destination / name
                          with target.open("xb") as handle:
                              handle.write(data)
              except (OSError, zipfile.BadZipFile, RuntimeError):
                  hold(reason + ":invalid-archive")

          for label, spec in fixed.items():
              source_meta = strict_json(
                  (root / "downloads" / f"{label}-source-metadata.json").read_bytes(),
                  dict, label + ":source-metadata",
              )
              custody_meta = strict_json(
                  (root / "downloads" / f"{label}-custody-metadata.json").read_bytes(),
                  dict, label + ":custody-metadata",
              )
              run_meta = strict_json(
                  (root / "downloads" / f"{label}-run-metadata.json").read_bytes(),
                  dict, label + ":run-metadata",
              )
              expected_run_url = f"https://github.com/{repository}/actions/runs/{spec['run']}"
              for meta, kind in ((source_meta, "source"), (custody_meta, "custody")):
                  exact(str(meta.get("id")), spec[kind + "_id"], label + f":{kind}-id")
                  exact(meta.get("name"), spec[kind + "_name"], label + f":{kind}-name")
                  exact(meta.get("expired"), False, label + f":{kind}-expired")
                  exact(str(meta.get("workflow_run", {}).get("id")), spec["run"], label + f":{kind}-run")
                  exact(meta.get("workflow_run", {}).get("head_sha"), spec["head"], label + f":{kind}-head")
                  exact(meta.get("workflow_run", {}).get("head_branch"), "main", label + f":{kind}-branch")
              exact(str(run_meta.get("id")), spec["run"], label + ":run-id")
              exact(str(run_meta.get("run_attempt")), spec["attempt"], label + ":run-attempt")
              exact(run_meta.get("head_sha"), spec["head"], label + ":run-head")
              exact(run_meta.get("head_branch"), "main", label + ":run-branch")
              exact(run_meta.get("event"), "workflow_dispatch", label + ":run-event")
              exact(run_meta.get("html_url"), expected_run_url, label + ":run-url")
              exact(run_meta.get("path"), workflow_path, label + ":run-workflow-path")

              source_zip = root / "downloads" / f"{label}-source.zip"
              custody_zip = root / "downloads" / f"{label}-custody.zip"
              exact(sha(source_zip.read_bytes()), spec["source_zip_sha256"], label + ":source-archive-hash")
              exact(sha(custody_zip.read_bytes()), spec["custody_zip_sha256"], label + ":custody-archive-hash")
              source_dir = root / "extracted" / f"{label}-source"
              custody_dir = root / "extracted" / f"{label}-custody"
              unzip_exact(source_zip, source_dir, source_members[label], label + ":source-archive")
              unzip_exact(custody_zip, custody_dir, custody_members, label + ":custody-archive")

              manifest_bytes = (custody_dir / "custody_manifest.json").read_bytes()
              exact(sha(manifest_bytes), spec["manifest_sha256"], label + ":manifest-hash")
              manifest = strict_json(manifest_bytes, dict, label + ":manifest")
              expected_canonical = json.dumps(
                  manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=True,
                  allow_nan=False,
              ).encode("utf-8")
              exact(manifest_bytes, expected_canonical, label + ":manifest-canonical")
              exact(manifest.get("source_endpoint"), spec["endpoint"], label + ":manifest-endpoint")
              scope = manifest.get("source_scope")
              if type(scope) is not dict:
                  hold(label + ":manifest-scope")
              exact(scope.get("event_id"), "2026_1295_azerbaijan_baku_baku", label + ":event")
              exact(scope.get("meeting_id"), "1295", label + ":meeting")
              exact(scope.get("session_id"), spec["session"], label + ":session")
              exact(manifest.get("original_artifact_member_count"), len(source_members[label]), label + ":member-count")
              exact(manifest.get("custody_manifest_contains_no_raw_source_bytes"), True, label + ":raw-custody-boundary")
              claims = manifest.get("github_execution_claims")
              if type(claims) is not dict:
                  hold(label + ":execution-claims")
              expected_claims = {
                  "repository": repository,
                  "workflow": workflow_name,
                  "workflow_ref": f"{repository}/{workflow_path}@{trusted_ref}",
                  "ref": trusted_ref,
                  "head_sha": spec["head"],
                  "run_id": spec["run"],
                  "run_attempt": spec["attempt"],
              }
              for key, value in expected_claims.items():
                  exact(claims.get(key), value, label + ":execution-claim:" + key)
              for claim in false_claims:
                  exact(manifest.get(claim), False, label + ":forbidden-claim:" + claim)

              inventory = manifest.get("original_artifact_members")
              if type(inventory) is not list or len(inventory) != len(source_members[label]):
                  hold(label + ":inventory")
              indexed = {}
              for item in inventory:
                  if type(item) is not dict:
                      hold(label + ":inventory-entry")
                  name = scalar_text(item.get("member_name"), label + ":inventory-name")
                  if name in indexed:
                      hold(label + ":inventory-duplicate")
                  indexed[name] = item
              if set(indexed) != source_members[label]:
                  hold(label + ":inventory-member-set")
              for name in source_members[label]:
                  data = (source_dir / name).read_bytes()
                  exact(indexed[name].get("sha256"), sha(data), label + ":member-hash:" + name)
                  exact(indexed[name].get("byte_length"), len(data), label + ":member-length:" + name)

              receipt_bytes = (source_dir / "source_capture_receipt.json").read_bytes()
              exact(sha(receipt_bytes), spec["receipt_sha256"], label + ":receipt-hash")
              receipt = strict_json(receipt_bytes, dict, label + ":receipt")
              exact(receipt.get("receipt_type"), "source_capture", label + ":receipt-type")
              exact(receipt.get("parent_receipt_ids"), [], label + ":receipt-parents")
              exact(receipt.get("scope"), scope, label + ":receipt-scope")
              raw = (source_dir / spec["raw_name"]).read_bytes()
              exact(sha(raw), spec["raw_sha256"], label + ":raw-hash")
              rows = strict_json(raw, list, label + ":raw")
              exact(len(rows), spec["raw_rows"], label + ":raw-row-count")
              for row in rows:
                  if type(row) is not dict:
                      hold(label + ":raw-row")
                  exact(str(row.get("meeting_key")), "1295", label + ":raw-meeting")
                  exact(str(row.get("session_key")), spec["session"], label + ":raw-session")
              source_uri = f"https://api.openf1.org/v1/{spec['endpoint']}?session_key={spec['session']}"
              payload = receipt.get("payload")
              if type(payload) is not dict:
                  hold(label + ":receipt-payload")
              exact(payload.get("source_uri"), source_uri, label + ":source-uri")
              exact(payload.get("source_sha256"), spec["raw_sha256"], label + ":receipt-raw-hash")

              metadata = strict_json(
                  (custody_dir / "github_attestation_metadata.json").read_bytes(),
                  dict, label + ":attestation-metadata",
              )
              exact(str(metadata.get("attestation_id")), spec["attestation_id"], label + ":attestation-id")
              exact(metadata.get("attestation_url"), f"https://github.com/{repository}/attestations/{spec['attestation_id']}", label + ":attestation-url")
              exact(metadata.get("subject_sha256"), spec["manifest_sha256"], label + ":metadata-subject")
              exact(metadata.get("bundle_sha256"), sha((custody_dir / "github_attestation.bundle.json").read_bytes()), label + ":metadata-bundle")
              exact(metadata.get("repository"), repository, label + ":metadata-repository")
              exact(metadata.get("workflow_path"), workflow_path, label + ":metadata-workflow")
              exact(metadata.get("git_ref"), trusted_ref, label + ":metadata-ref")
              exact(metadata.get("git_head_sha"), spec["head"], label + ":metadata-head")
              exact(metadata.get("run_id"), spec["run"], label + ":metadata-run")
              exact(metadata.get("run_attempt"), spec["attempt"], label + ":metadata-attempt")
              print(
                  f"{label}: archive_binding=PASS source_id={spec['source_id']} "
                  f"source_zip_sha256={spec['source_zip_sha256']} custody_id={spec['custody_id']} "
                  f"custody_zip_sha256={spec['custody_zip_sha256']} manifest_sha256={spec['manifest_sha256']}"
              )
          PY

      - name: Verify WEATHER custody with official GitHub CLI
        run: |
          set -euo pipefail
          gh attestation verify "$WORK_ROOT/extracted/weather-custody/custody_manifest.json" \
            --repo "$GH_REPO" \
            --bundle "$WORK_ROOT/extracted/weather-custody/github_attestation.bundle.json" \
            --cert-identity "https://github.com/${GH_REPO}/${TRUSTED_WORKFLOW}@${TRUSTED_REF}" \
            --source-ref "$TRUSTED_REF" \
            --source-digest '350399dc1c03eb64563cba5db1fa6c13627185ec' \
            --deny-self-hosted-runners \
            --format json > "$WORK_ROOT/weather-verification.json"

      - name: Verify DRIVERS custody with official GitHub CLI
        run: |
          set -euo pipefail
          gh attestation verify "$WORK_ROOT/extracted/drivers-custody/custody_manifest.json" \
            --repo "$GH_REPO" \
            --bundle "$WORK_ROOT/extracted/drivers-custody/github_attestation.bundle.json" \
            --cert-identity "https://github.com/${GH_REPO}/${TRUSTED_WORKFLOW}@${TRUSTED_REF}" \
            --source-ref "$TRUSTED_REF" \
            --source-digest '350399dc1c03eb64563cba5db1fa6c13627185ec' \
            --deny-self-hosted-runners \
            --format json > "$WORK_ROOT/drivers-verification.json"

      - name: Verify STARTING_GRID custody with official GitHub CLI
        run: |
          set -euo pipefail
          gh attestation verify "$WORK_ROOT/extracted/starting_grid-custody/custody_manifest.json" \
            --repo "$GH_REPO" \
            --bundle "$WORK_ROOT/extracted/starting_grid-custody/github_attestation.bundle.json" \
            --cert-identity "https://github.com/${GH_REPO}/${TRUSTED_WORKFLOW}@${TRUSTED_REF}" \
            --source-ref "$TRUSTED_REF" \
            --source-digest '60c41305fcf4d7752027df8633397bf6025c28c0' \
            --deny-self-hosted-runners \
            --format json > "$WORK_ROOT/starting_grid-verification.json"

      - name: Enforce signed identity and emit bounded hash-only diagnostics
        env:
          FIXED_EVIDENCE_JSON: >-
            {"weather":{"run":"38759663655","attempt":"1","head":"350399dc1c03eb64563cba5db1fa6c13627185ec","source_id":"11984079371","source_zip_sha256":"3e00b6b5f2d0ac11840fa85e60b7bc2de290fc82888ea0b8736b3b5f700aad7a","custody_id":"11985256891","custody_zip_sha256":"dc75297f0658c2dce3d03a631df69baa73283827e6accf21a6ec230fdd6ca410","manifest_sha256":"a9c5b0d7c3b21ebd29cc8b88cf5245f3cb0c5eebb835c233881d9770b7af321c"},"drivers":{"run":"38760517922","attempt":"1","head":"350399dc1c03eb64563cba5db1fa6c13627185ec","source_id":"11985667090","source_zip_sha256":"cf1899aefffeaad49dce1c8605159937d62a96286cf93778649d372b91712f3a","custody_id":"11985134183","custody_zip_sha256":"120e3164eb43a59059a19db0d0cacb701e8163d8bd67e7ec82b9976898e22e6d","manifest_sha256":"0f5f4d9606365df7fb8013301d56f4ea082bec1eb6d3bed82f91942edff216a3"},"starting_grid":{"run":"38727977099","attempt":"1","head":"60c41305fcf4d7752027df8633397bf6025c28c0","source_id":"11969660460","source_zip_sha256":"29ccb6752ac62274f7c73d38893068a31c3626f45a963871b00ba8ef80455e88","custody_id":"11969236113","custody_zip_sha256":"e7ba66c88158303cb9a17232ef2435988664385e0587792d40db9d3284283a34","manifest_sha256":"cf88e0bee662327276fc16ee57ef2c01e1d8679e501cb321a2080f30fb875399"}}
        run: |
          set -euo pipefail
          printf '%s' "$FIXED_EVIDENCE_JSON" > "$WORK_ROOT/verification-policy.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["WORK_ROOT"])
          fixed = json.loads((root / "verification-policy.json").read_text())
          repository = os.environ["GH_REPO"]
          repository_id = os.environ["TRUSTED_REPOSITORY_ID"]
          workflow = os.environ["TRUSTED_WORKFLOW"]
          ref = os.environ["TRUSTED_REF"]
          identity = f"https://github.com/{repository}/{workflow}@{ref}"

          def hold(reason):
              raise SystemExit("HOLD: " + reason)

          def exact(actual, expected, reason):
              if actual != expected:
                  hold(reason)

          def required(obj, key, reason):
              if type(obj) is not dict or key not in obj:
                  hold(reason)
              return obj[key]

          for label, spec in fixed.items():
              try:
                  report = json.loads((root / f"{label}-verification.json").read_text())
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  hold(label + ":official-verification-report")
              if type(report) is not list or len(report) != 1 or type(report[0]) is not dict:
                  hold(label + ":verification-result-count")
              result = required(report[0], "verificationResult", label + ":verification-result")
              signature = required(result, "signature", label + ":signature")
              certificate = required(signature, "certificate", label + ":certificate")
              timestamps = required(result, "verifiedTimestamps", label + ":verified-timestamps")
              if type(timestamps) is not list or not timestamps:
                  hold(label + ":verified-timestamp-empty")
              exact(str(required(certificate, "sourceRepositoryIdentifier", label + ":signed-repository-id")), repository_id, label + ":signed-repository-id")
              exact(required(certificate, "sourceRepositoryURI", label + ":signed-repository-uri"), f"https://github.com/{repository}", label + ":signed-repository-uri")
              exact(required(certificate, "sourceRepositoryRef", label + ":signed-ref"), ref, label + ":signed-ref")
              exact(required(certificate, "sourceRepositoryDigest", label + ":signed-commit"), spec["head"], label + ":signed-commit")
              exact(required(certificate, "runnerEnvironment", label + ":signed-runner"), "github-hosted", label + ":signed-runner")
              exact(required(certificate, "runInvocationURI", label + ":signed-invocation"), f"https://github.com/{repository}/actions/runs/{spec['run']}/attempts/{spec['attempt']}", label + ":signed-invocation")
              exact(required(certificate, "buildConfigURI", label + ":signed-workflow"), identity, label + ":signed-workflow")
              exact(required(certificate, "buildConfigDigest", label + ":signed-workflow-commit"), spec["head"], label + ":signed-workflow-commit")
              exact(required(certificate, "buildTrigger", label + ":signed-trigger"), "workflow_dispatch", label + ":signed-trigger")
              exact(required(certificate, "issuer", label + ":signed-issuer"), "https://token.actions.githubusercontent.com", label + ":signed-issuer")
              exact(required(certificate, "subjectAlternativeName", label + ":signed-certificate-identity"), identity, label + ":signed-certificate-identity")

              statement = required(result, "statement", label + ":statement")
              exact(required(statement, "_type", label + ":statement-type"), "https://in-toto.io/Statement/v1", label + ":statement-type")
              exact(required(statement, "predicateType", label + ":predicate-type"), "https://slsa.dev/provenance/v1", label + ":predicate-type")
              subjects = required(statement, "subject", label + ":subject")
              if type(subjects) is not list or len(subjects) != 1 or type(subjects[0]) is not dict:
                  hold(label + ":subject-count")
              subject = subjects[0]
              name = required(subject, "name", label + ":subject-name")
              if type(name) is not str or not name.endswith("custody_manifest.json"):
                  hold(label + ":subject-name")
              digest = required(subject, "digest", label + ":subject-digest")
              if type(digest) is not dict or set(digest) != {"sha256"}:
                  hold(label + ":subject-digest-shape")
              exact(digest["sha256"], spec["manifest_sha256"], label + ":subject-digest")

              print(
                  f"{label}: trusted_verification=PASS run={spec['run']} attempt={spec['attempt']} "
                  f"head={spec['head']} source_artifact_id={spec['source_id']} "
                  f"source_zip_sha256={spec['source_zip_sha256']} custody_artifact_id={spec['custody_id']} "
                  f"custody_zip_sha256={spec['custody_zip_sha256']} manifest_sha256={spec['manifest_sha256']}"
              )
          print("K4R37=PASS classification=HISTORICAL_POST_EVENT_NON_PROSPECTIVE production_claim=false promotion_allowed=false dr002_activated=false")
