name: DR-002 synthetic frozen producer shadow pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One synthetic frozen-mode producer CLI shadow
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IMPLEMENTATION_SHA: ${{ github.sha }}
          SHADOW_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python scripts/forecast_bundles/dr002_frozen_producer_shadow_pilot_v1.py
          --implementation-git-sha "$IMPLEMENTATION_SHA"
          --run-id "$SHADOW_RUN_ID"
      - name: Attest exact successful shadow manifest
        id: attest_shadow
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 (immutable release)
        with:
          subject-path: _runtime/dr002_pre2b7c_frozen_producer_shadow/gha-${{ github.run_id }}-${{ github.run_attempt }}/execution_manifest.json
          push-to-registry: false
          create-storage-record: false
      - name: Preserve attestation bundle and factual metadata
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_shadow.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest_shadow.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest_shadow.outputs.attestation-url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]
          if not run_id.isdigit() or not attempt.isdigit():
              raise ValueError("Invalid GitHub run identity")
          root = Path("_runtime/dr002_pre2b7c_frozen_producer_shadow") / ("gha-" + run_id + "-" + attempt)
          subject = root / "execution_manifest.json"
          subject_bytes = subject.read_bytes()
          manifest = json.loads(subject_bytes)
          if manifest["status"] != "SHADOW_EXECUTION_ONLY_NOT_A_PRODUCTION_FORECAST":
              raise ValueError("Only successful synthetic shadow manifests may be preserved")
          if manifest["implementation_git_sha"] != os.environ["HEAD_SHA"]:
              raise ValueError("Manifest/run head mismatch")
          digest = hashlib.sha256(subject_bytes).hexdigest()
          bundle_bytes = Path(os.environ["ATTESTATION_BUNDLE_PATH"]).read_bytes()
          bundle = json.loads(bundle_bytes)
          # Consistency check only: independent signature/identity verification is later.
          statement = json.loads(base64.b64decode(bundle["dsseEnvelope"]["payload"], validate=True))
          subjects = statement["subject"]
          if len(subjects) != 1 or subjects[0]["digest"].get("sha256") != digest:
              raise ValueError("Attestation subject/manifest mismatch")
          attestation_id = os.environ["ATTESTATION_ID"]
          attestation_url = os.environ["ATTESTATION_URL"]
          repository = os.environ["REPOSITORY"]
          if not attestation_id.isdigit() or attestation_url != "https://github.com/" + repository + "/attestations/" + attestation_id:
              raise ValueError("Missing or inconsistent attestation outputs")
          for field in ("production_authenticated", "historical_availability_proven",
                        "stable_engine_execution_proven", "blind_validation_eligible", "dr002_activated"):
              if manifest[field] is not False:
                  raise ValueError("Unsupported trust claim")
          bundle_target = root / "github_attestation.bundle.json"
          bundle_target.write_bytes(bundle_bytes)
          if bundle_target.read_bytes() != bundle_bytes:
              raise ValueError("Bundle readback mismatch")
          metadata = {
              "schema_version": "dr002-github-shadow-attestation-metadata-v1",
              "attestation_id": attestation_id,
              "attestation_url": attestation_url,
              "subject_relative_path": subject.as_posix(),
              "subject_sha256": digest,
              "repository": repository,
              "workflow_path": ".github/workflows/dr002-frozen-producer-shadow-pilot.yml",
              "workflow_name": os.environ["WORKFLOW_NAME"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "git_head_sha": os.environ["HEAD_SHA"],
              "run_id": run_id,
              "run_attempt": attempt,
              "production_authenticated": False,
              "historical_availability_proven": False,
              "stable_engine_execution_proven": False,
              "blind_validation_eligible": False,
              "dr002_activated": False,
          }
          metadata_bytes = (json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          metadata_target = root / "github_attestation_metadata.json"
          metadata_target.write_bytes(metadata_bytes)
          if metadata_target.read_bytes() != metadata_bytes or subject.read_bytes() != subject_bytes:
              raise ValueError("Metadata readback or immutable subject mismatch")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr002-frozen-producer-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: _runtime/dr002_pre2b7c_frozen_producer_shadow/**
          if-no-files-found: warn
