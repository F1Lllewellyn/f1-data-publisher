name: F1 OpenF1 Lightweight Source Closure

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'F1 season year'
        required: true
        default: '2026'
      completed_only:
        description: 'Only retrieve completed sessions'
        required: true
        default: 'true'
      provenance_shadow_session_key:
        description: 'Optional exact historical session key for manual provenance shadow only'
        required: false
        default: ''
      provenance_shadow_endpoint:
        description: 'Historical provenance shadow endpoint'
        required: false
        type: choice
        options:
          - weather
          - drivers
        default: weather
  schedule:
    # Lightweight only. Runs after common race-weekend session windows.
    - cron: '20 12 * * 5'
    - cron: '20 17 * * 5'
    - cron: '20 12 * * 6'
    - cron: '20 17 * * 6'
    - cron: '20 18 * * 0'

permissions:
  contents: write
  actions: read

concurrency:
  group: f1-main-write-serialization
  cancel-in-progress: false

jobs:
  openf1-lightweight-source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Reject drivers shadow without explicit session
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provenance_shadow_endpoint == 'drivers' && github.event.inputs.provenance_shadow_session_key == '' }}
        run: |
          echo "Drivers provenance shadow requires an explicit historical session key."
          exit 1

      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.provenance_shadow_endpoint != 'drivers' || github.event.inputs.provenance_shadow_session_key != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.provenance_shadow_session_key == '' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests openpyxl

      - name: Enforce main-only provenance shadow
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provenance_shadow_session_key != '' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Provenance shadow is restricted to refs/heads/main."
          exit 1

      - name: Run lightweight OpenF1 source closure publisher
        env:
          PROVENANCE_SHADOW_ENDPOINT: ${{ github.event.inputs.provenance_shadow_endpoint || 'weather' }}
        run: |
          python scripts/openf1/publish_openf1_lightweight_source_closure.py \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --completed-only "${{ github.event.inputs.completed_only || 'true' }}" \
            --provenance-shadow-session-key "${{ github.event.inputs.provenance_shadow_session_key || '' }}" \
            --provenance-shadow-endpoint "$PROVENANCE_SHADOW_ENDPOINT" \
            --github-repository "${{ github.repository }}" \
            --github-workflow "${{ github.workflow }}" \
            --github-workflow-ref "${{ github.workflow_ref }}" \
            --github-ref "${{ github.ref }}" \
            --github-sha "${{ github.sha }}" \
            --github-run-id "${{ github.run_id }}" \
            --github-run-attempt "${{ github.run_attempt }}"

      - name: Upload legacy source closure artifact
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.provenance_shadow_session_key == '') }}
        uses: actions/upload-artifact@v6
        with:
          name: openf1-lightweight-source-closure
          path: |
            latest/openf1_lightweight_source_closure/**
          retention-days: 30

      - name: Upload historical REST provenance shadow artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.provenance_shadow_session_key != '' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.inputs.provenance_shadow_endpoint == 'drivers' && 'dr002-pre2b7k4r7-openf1-drivers-historical-rest-shadow' || 'dr002-pre2b7k4r2-openf1-historical-rest-shadow' }}
          path: |
            _runtime/dr002_pre2b7k4r2_openf1_historical_rest_shadow/gha-${{ github.run_id }}-${{ github.run_attempt }}/**
          retention-days: 30

      - name: Commit source closure outputs
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.provenance_shadow_session_key == '') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest/openf1_lightweight_source_closure history/openf1_lightweight_source_closure || true
          if git diff --cached --quiet; then
            echo "No source-closure changes to commit."
          else
            git commit -m "Update OpenF1 lightweight source closure artifacts"
            bash scripts/ops/safe_git_push_rebase_retry.sh


          fi
