name: F1 1B Integrated Recovery PR Tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'configs/**'
      - '.github/workflows/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: f1-1b-recovery-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests pandas openpyxl PyYAML
      - name: Run offline integration and custody regressions
        run: |
          python -m unittest discover -s tests -p 'test_f1_1b_integrated_recovery_*.py' -v
          python -m unittest discover -s tests -p 'test_f1_producer_lock_custody_*.py' -v
