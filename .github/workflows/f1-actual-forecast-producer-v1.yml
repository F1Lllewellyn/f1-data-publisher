name: F1 Actual Forecast Producer v1

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Event identifier for forecast rows
        required: true
        default: manual_forecast_producer_validation
      race_name:
        description: Race/event display name
        required: true
        default: Manual Forecast Producer Validation
      gate:
        description: Gate to produce rows for
        required: true
        default: all
        type: choice
        options:
          - all
          - pre_weekend
          - post_fp3
          - post_qualifying
          - race_result
          - post_event
      lane:
        description: Engine lane to produce rows for
        required: true
        default: all
        type: choice
        options:
          - all
          - stable_baseline
          - control_room_overlay
          - experimental_challenger
      strict_source:
        description: Fail if no usable source rows exist
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      commit_outputs:
        description: Commit generated forecast rows when actual rows are created
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: f1-main-write-serialization
  cancel-in-progress: false

jobs:
  produce-forecast-rows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify scientific execution authority before producer invocation
        env:
          EVENT_ID: ${{ inputs.event_id }}
          GATE: ${{ inputs.gate }}
          LANE: ${{ inputs.lane }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/forecast_bundles/validate_forecast_chain_readiness_v1.py \
            --repo . --event-id "$EVENT_ID" --gate "$GATE" --lane "$LANE" \
            --preflight-only --strict
          # No authenticated protected execution adapter is available. The
          # frozen research producer is not a substitute and is never invoked.

      - name: Upload runtime audit
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: f1-actual-forecast-producer-v1-runtime
          path: |
            _runtime/forecast_scientific_hold/**
          if-no-files-found: warn

