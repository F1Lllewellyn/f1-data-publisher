name: F1 Vegas 2026 FIA Final Grid Doc53 Retrospective Authority

# One original read after reviewed deployment. NO original PDF content or
# result table is published to the repository. An inability to authenticate
# the original FIA document is an explicit, nonpromoting authority HOLD.
on:
  pull_request:
    paths:
      - '.github/workflows/f1-vegas-2026-fia-doc53-retrospective-authority.yml'
      - 'scripts/ops/f1_vegas_2026_fia_doc53_retrospective_v1.py'
      - 'tests/test_f1_vegas_2026_fia_doc53_retrospective_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/f1-vegas-2026-fia-doc53-retrospective-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preserve existing DR-002 cutoff and official source custody rules
        run: python -m unittest discover -s tests -p test_f1_vegas_2026_fia_doc53_retrospective_v1.py -v

  original-fia-observation:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install bounded PDF text extraction only
        run: python -m pip install 'pymupdf==1.26.6'
      - name: Authenticate official index, original document and retrospective grid
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python scripts/ops/f1_vegas_2026_fia_doc53_retrospective_v1.py \
              --output _runtime/f1_fia_doc53_retro/authority_report.json \
              --publish-to-repo .
          else
            python scripts/ops/f1_vegas_2026_fia_doc53_retrospective_v1.py \
              --output _runtime/f1_fia_doc53_retro/authority_report.json
          fi
      - name: Commit append-only Doc53 original-source identity (main push only)
        if: ${{ success() && github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet HEAD -- .github scripts configs docs .gitignore history; then
            echo "HOLD_UNAUTHORIZED_SOURCE_OR_HISTORY_MUTATION"
            exit 2
          fi
          test -f history/fia_grid_authority/2026_1300/11420/doc53_source_receipt.json
          test -f latest/fia_grid_authority/2026_1300_race_11420.json
          if git status --porcelain | grep -E 'Engine_2026-06-07_STABLE|F1_2026_Prediction_Model_Data_Workbook.*xlsx'; then
            echo "HOLD_PROTECTED_ASSET_MUTATION"; exit 2
          fi
          git diff --cached --quiet || { echo HOLD_PRESTAGED_INPUT; exit 2; }
          git add -- history/fia_grid_authority/2026_1300/11420/doc53_source_receipt.json                     latest/fia_grid_authority/2026_1300_race_11420.json
          if git diff --cached --quiet; then
            echo "Exact FIA source receipt already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: retain immutable FIA Vegas Doc53 retrospective authority receipt"
            bash scripts/ops/safe_git_push_rebase_retry.sh
          fi

      - name: Retain only FIA source receipt metadata, never raw copyrighted grid
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: f1-vegas-2026-fia-doc53-retro-${{ github.run_id }}-${{ github.run_attempt }}
          path: _runtime/f1_fia_doc53_retro/authority_report.json
          if-no-files-found: warn
          retention-days: 90
